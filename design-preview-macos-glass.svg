<svg width="1600" height="1000" viewBox="0 0 1600 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1600" y2="1000" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F7F8FC"/>
      <stop offset="0.45" stop-color="#EEF3FF"/>
      <stop offset="1" stop-color="#F9F5FF"/>
    </linearGradient>
    <linearGradient id="primary" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7C5CFF"/>
      <stop offset="1" stop-color="#4AB3FF"/>
    </linearGradient>
    <linearGradient id="success" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#58D68D"/>
      <stop offset="1" stop-color="#2ECCB1"/>
    </linearGradient>
    <filter id="blurBlob" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="70"/>
    </filter>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#121827" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#121827" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 700 42px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .h2 { font: 700 24px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .h3 { font: 650 18px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .body { font: 500 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #6B7280; }
      .small { font: 600 12px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #8A93A3; letter-spacing: .08em; }
      .metric { font: 750 34px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #111827; }
      .nav { font: 650 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #697386; }
      .navActive { font: 700 15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #25185E; }
      .glass { fill: rgba(255,255,255,.64); stroke: rgba(255,255,255,.78); stroke-width: 1.2; filter: url(#shadow); }
      .glassSoft { fill: rgba(255,255,255,.54); stroke: rgba(255,255,255,.72); stroke-width: 1.1; filter: url(#softShadow); }
      .hairline { stroke: rgba(17,24,39,.07); stroke-width: 1; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <circle cx="260" cy="180" r="170" fill="#A78BFA" opacity="0.45" filter="url(#blurBlob)"/>
  <circle cx="1250" cy="120" r="210" fill="#60A5FA" opacity="0.38" filter="url(#blurBlob)"/>
  <circle cx="1050" cy="840" r="240" fill="#F0ABFC" opacity="0.34" filter="url(#blurBlob)"/>
  <circle cx="460" cy="810" r="190" fill="#99F6E4" opacity="0.28" filter="url(#blurBlob)"/>

  <rect x="70" y="62" width="1460" height="876" rx="34" class="glass"/>

  <!-- Sidebar -->
  <rect x="92" y="86" width="260" height="828" rx="28" fill="rgba(255,255,255,.52)" stroke="rgba(255,255,255,.70)"/>
  <circle cx="133" cy="126" r="16" fill="#FF5F57" opacity="0.88"/>
  <circle cx="177" cy="126" r="16" fill="#FFBD2E" opacity="0.88"/>
  <circle cx="221" cy="126" r="16" fill="#28C840" opacity="0.88"/>

