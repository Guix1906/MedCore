  <!-- Spotlight overlay sample -->
  <rect x="520" y="210" width="560" height="96" rx="28" fill="rgba(255,255,255,.68)" stroke="rgba(255,255,255,.88)" filter="url(#shadow)"/>
  <circle cx="558" cy="258" r="11" stroke="#6B7280" stroke-width="2.4"/>
  <path d="M566 266l11 11" stroke="#6B7280" stroke-width="2.4" stroke-linecap="round"/>
  <text x="598" y="253" class="h3">Spotlight do MedCore</text>
