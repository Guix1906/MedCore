  <text x="1220" y="789" class="body" font-size="13">15:10 - Primeira consulta</text>

  <rect x="1180" y="818" width="264" height="56" rx="18" fill="rgba(255,255,255,.62)" stroke="rgba(255,255,255,.78)"/>
