  <path d="M438 800 C500 756, 540 774, 600 726 C662 676, 724 710, 786 656 C850 601, 915 645, 980 606 C1025 580, 1056 588, 1084 558 L1084 834 L438 834 Z" fill="url(#primary)" opacity="0.10"/>
  <circle cx="786" cy="656" r="8" fill="#6D3FF5" stroke="white" stroke-width="4"/>
  <rect x="724" y="574" width="132" height="56" rx="18" fill="rgba(255,255,255,.72)" stroke="rgba(255,255,255,.88)" filter="url(#softShadow)"/>
